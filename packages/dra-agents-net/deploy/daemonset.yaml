apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dra-agents-net
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: dra-agents-net
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dra-agents-net
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dra-agents-net
    spec:
      serviceAccountName: dra-agents-net
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 330
      tolerations:
        - operator: Exists
      containers:
        - name: dra-agents-net
          image: registry.k8s.io/agent-sandbox/dra-agents-net:latest
          args:
            - --driver-name=dra.agents.net
            - --socket-root=/run/dra-agents-net/pods
            - --checkpoint-path=/run/dra-agents-net/state.db
            - --kubelet-root-dir=/var/lib/kubelet
            - --metrics-addr=:9102
            - --ingress-addr=:15080
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9102
              protocol: TCP
            - name: ingress
              containerPort: 15080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          securityContext:
            privileged: true
          volumeMounts:
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
              mountPropagation: HostToContainer
            - name: netns
              mountPath: /var/run/netns
              readOnly: true
              mountPropagation: HostToContainer
            - name: nri-sock
              mountPath: /var/run/nri
            - name: dra-agents-net-run
              mountPath: /run/dra-agents-net
            - name: node-token
              mountPath: /var/run/secrets/dra-agents-net
              readOnly: true
      volumes:
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
            type: DirectoryOrCreate
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
        - name: nri-sock
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: dra-agents-net-run
          hostPath:
            path: /run/dra-agents-net
            type: DirectoryOrCreate
        - name: node-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agents.net/upstream
                  expirationSeconds: 3600
                  path: token
