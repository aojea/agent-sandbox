# Kubernetes DRA DeviceClass for dra-agents-net (driver: dra.agents.net).
# Pairs with DRAConsumableCapacity (Beta, enabled by default since Kubernetes 1.36):
# each node publishes a single shared "agents-net" device whose requestPolicy defaults
# to consuming 1 sandbox unit per ResourceClaim.
# Driver-specific datapath parameters (adapterMode, proxy port/noProxy, connection limits,
# and optional cluster-wide TLS/CA/auth defaults) live here under dra.agents.net/v1alpha1
# DriverConfig; individual Sandboxes layer their portable SandboxNetworkConfiguration
# (including the required policyEnforcementPoint) via ResourceClaim Opaque parameters.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dra.agents.net
spec:
  selectors:
    - cel:
        expression: device.driver == "dra.agents.net"
  config:
    - opaque:
        driver: dra.agents.net
        parameters:
          apiVersion: dra.agents.net/v1alpha1
          kind: DriverConfig
          confinementMode: PodNetworkIsolated
          nicBlockMode: DropAll
          adapterMode: ExplicitProxy
          proxy:
            port: 15001
          maxConnections: 1024
          idleTimeoutSeconds: 300
