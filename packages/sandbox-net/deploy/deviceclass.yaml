# DraNet-style standard GA Kubernetes DRA DeviceClass for sandbox-net agents.net plumbing.
# Works with plain GA resource.k8s.io/v1 (no alpha/beta DRA feature gates required).
# Cluster administrators may configure default upstream, CA trust, and auth
# parameters in spec.config[].opaque.parameters; individual Sandboxes or
# ResourceClaims can override or extend them with custom metadata.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: sandbox-net.agents.x-k8s.io
spec:
  selectors:
    - cel:
        expression: device.driver == "sandbox-net.agents.x-k8s.io"
  config:
    - opaque:
        driver: sandbox-net.agents.x-k8s.io
        parameters:
          confinementMode: PodNetworkIsolated
          adapterMode: TunSidecar
          maxConnections: 1024
          idleTimeoutSeconds: 300
